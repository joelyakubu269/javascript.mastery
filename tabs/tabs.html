<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabs</title>
    <link rel="stylesheet" href="tabs.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#" data-tab="0" onclick="display(this)">First Tab</a></li>
                <li><a href="#" data-tab="1"onclick="display(this)">Second Tab</a></li>
                <li><a href="#" data-tab="2"onclick="display(this)">Third Tab</a></li>
                <li><a href="#" data-tab="3"onclick="display(this)">Fourth Tab</a></li>
            </ul>
        </nav>
        <p >clicking each tab should hide the content of the other tab and show the content of the clicked tab. By default enable the first tab</p>
    </header>
    <main>
        <p class="content"></p>
    </main>
    <script src="tabs.js"></script>
</body>
</html>
