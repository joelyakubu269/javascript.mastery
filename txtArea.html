<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max character count</title>
    <style>
        #amber{
            border: 4px solid black;
        }
    </style>
</head>
<body>
    <textarea name="marx" id="amber" maxlength="250">0/250</textarea>
    <script>
        const txtarea= document.getElementById("amber")
        txtarea.addEventListener("input",()=>{
            let num = txtarea.value.length
            txtarea.textContent= `${num/250}`
            if (num>=250){
                txtarea.style.borderColor= "red"
            }
        })
        
    </script>
</body>
</html>
