<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogues in javascript</title>
    <style>
       body {
    background-color: white;
    border: 2px solid black;
    border-radius: 20px;
    box-sizing: border-box;
    min-height: 100vh;
  }

 dialog {
            position: fixed;
            bottom: 20px;
            right: 20px;
            margin: 0;
            width: 300px;
            min-height: 340px;
            padding: 25px;
            box-sizing: border-box;
            border: none;
            border-radius: 20px;
            background-color: black;
            color: white;

            & #container {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 100%;
                gap: 20px;
            }

            & #cookie-icon {
                font-size: 40px;
            }

            & #cookies {
                font-size: 22px;
            }

            & button {
                width: 100%;
                padding: 15px;
                border: none;
                border-radius: 12px;
                background-color: white;
                color: black;
                font-size: 18px;
                cursor: pointer;
            }

            & #close {
                width: auto;
                padding: 0;
                background: transparent;
                color: white;
                align-self: flex-end;
                font-size: 24px;
            }
        }

        dialog::backdrop {
            background-color: rgba(255, 255, 255, 0.75);
        }

  
    </style>
</head>
<body>
   <dialog id="mydialogue">
        <div id="container">

            <form method="dialog">
                <button id="close" aria-label="Close">&times;</button>
            </form>

            <p id="cookie-icon">🍪</p>

            <p id="cookies">
                We use cookies to improve your user experience.
            </p>

            <form method="dialog">
                <button value="accepted">I like Cookies</button>
            </form>

        </div>
    </dialog>
     <script>
        const popup = document.querySelector("#mydialogue");

        popup.showModal();
    </script>
</body>

</html>
