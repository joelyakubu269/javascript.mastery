<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogues in javascript</title>
    <style>
       body {
    background-color: white;
    border: 2px solid black;
    border-radius: 20px;
    box-sizing: border-box;
    min-height: 100vh;
  }

  dialog {
    border: none;
    position: fixed;
    margin: 0;
    width: 300px;
  min-height: 340px;
  padding: 25px;
  bottom: 20px;
  left: auto;
  right: 20px;
  }

  dialog[open] {
    display: flex;
    flex-direction: column;
    background-color: black;
    border: 4px solid black;
    min-height: 20vh;
    border-radius: 10px;
    justify-content: space-between;
    align-items: center;
    & #container {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    gap: 20px;
}
    & #cookies {
        font-size: larger;
        font-style: italic;
        color: white;
    }
    & #like{
        display: flex;
        border: 4px solid white;
        border-radius: 2px;
        min-height: 5vh;
        color: black;
        background-color: white;
          justify-content: center;
        align-items: center;
        text-align: center;
    }
  }
    </style>
</head>
<body>
    <dialog id="mydialogue" open>
        <div id="container">
            <p></p>
            <p id="cookies">We use cookies to improve your experinece</p>
            <p id="like">i like cookies</p>
        </div>
        <form method="dialog">
            <button>Accept</button>
        </form>
    </dialog>
    
</body>

</html>
